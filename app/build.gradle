import java.text.SimpleDateFormat

plugins {
    id('com.android.application')
    id('org.jetbrains.kotlin.android')
}

// 读取项目根目录下的 keystore.properties 签名配置文件
// 此文件已加入 .gitignore，不会提交到 Git 仓库
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.pengxh.daily.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pengxh.daily.app'
        minSdk 26
        targetSdk 36
        versionCode 2301
        versionName '2.3.0.1'
    }

    flavorDimensions += 'versionCode'

    signingConfigs {
        release {
            // 从 keystore.properties 读取，不在此处硬编码任何密码
            // 支持两种路径写法：
            //   STORE_FILE=release.jks        → 项目根目录
            //   STORE_FILE=../release.jks     → 也解析到项目根目录（兼容旧配置）
            def rawPath = keystoreProperties['STORE_FILE']
            if (rawPath) {
                // 统一去掉开头的 ../ 前缀，始终相对于 rootProject 目录查找
                def normalizedPath = rawPath.replaceAll(/^\.\.\//, '')
                storeFile = rootProject.file(normalizedPath)
            } else {
                storeFile = null
            }
            storePassword keystoreProperties['STORE_PASSWORD'] ?: ''
            keyAlias      keystoreProperties['KEY_ALIAS']      ?: ''
            keyPassword   keystoreProperties['KEY_PASSWORD']   ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    // 固定包名：保留阿里系样式（降低被目标应用识别的特征），
    // 同时保证可以覆盖安装升级——随机包名会导致每次升级都是全新安装，
    // 任务、邮箱配置、持久化配置全部丢失
    String id = "com.alibaba.android.mqzvxr"
    productFlavors {
        daily {
            applicationId = id
        }
    }

    packagingOptions {
        exclude 'META-INF/NOTICE.md'
        exclude 'META-INF/LICENSE.md'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    applicationVariants.configureEach {
        outputs.configureEach {
            outputFileName = "DT_${getBuildDate()}_${android.defaultConfig.versionName}.apk"
        }
    }
}

static def getBuildDate() {
    SimpleDateFormat dateFormat = new SimpleDateFormat('yyyyMMdd', Locale.CHINA)
    return dateFormat.format(System.currentTimeMillis())
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'com.github.AndroidCoderPeng:Kotlin-lite-lib:1.1.7'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.scwang.smartrefresh:SmartRefreshLayout:1.1.0'
    //数据库框架
    implementation 'androidx.room:room-runtime:2.8.2'
    annotationProcessor 'androidx.room:room-compiler:2.8.2'
    //邮件
    implementation 'com.sun.mail:android-mail:1.6.8'
    implementation 'com.sun.mail:android-activation:1.6.8'
    //日期、时间选择器
    implementation 'com.github.gzu-liyujiang.AndroidPicker:WheelPicker:4.1.14'
    implementation 'com.google.code.gson:gson:2.13.2'
    //异常日志记录
    implementation 'com.tencent.bugly:crashreport:4.1.9.3'
}
